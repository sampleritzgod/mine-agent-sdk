packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
# These ship platform-specific native binaries / postinstall steps and need
# their install scripts to run. All are build-time only, none reach the
# published SDK:
#   esbuild        — via tsx, runs the examples
#   sharp          — via Next.js, optimises images for the docs site
#   unrs-resolver  — via eslint-config-next, resolves imports while linting
#   @google/genai  — optional peer dep of the Gemini provider (postinstall)
#   protobufjs     — transitive dep needing a native build step
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@google/genai": true
  protobufjs: true
